name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      # The page bundles these for reading in place, so a change to them is a change to the page.
      - 'CMakeLists.txt'
      - 'build-python.sh'
      - 'cmake/**'
      - 'src/cuda/cuda_link.cu'
      - 'tests/win_native_cuda_tests/**'
      - 'packaging/windows_cuda_portable/**'
      - 'docs/Windows*.md'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: none

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # The repository files the page points at, copied into site/assets/source at this revision.
      - name: Bundle source for reading in place
        shell: bash
        run: node site/scripts/bundle-source.mjs
      - name: Validate static site
        shell: bash
        run: |
          test -f site/index.html
          test -f site/source.html
          test -f site/assets/site.css
          test -f site/assets/site.js
          test -f site/assets/og.png
          test -f site/assets/source/index.json
          # assets/source holds copies of repository files, which may use the word; the page itself may not.
          if grep -Rni --exclude='og.png' --exclude-dir='source' 'fork' site; then
            echo 'The project page must describe this implementation directly.' >&2
            exit 1
          fi
      # Links, console errors, both colour schemes and a 390px phone, in the runner's Chrome.
      - name: Check site in a browser
        shell: bash
        run: |
          npm ci --prefix site/tests --no-audit --no-fund
          if ! test -x /usr/bin/google-chrome; then
            node site/tests/node_modules/playwright-core/cli.js install chromium
          fi
          node site/tests/check-site.mjs
      # Publish the site without its tests and build scripts.
      - name: Stage site
        shell: bash
        run: |
          mkdir _site
          cp -R site/. _site/
          rm -rf _site/tests _site/scripts
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
